name: CI-CD

on:
  push:
    branches: [main]
    paths:                       # déclencheurs : code OU nouvelles données
      - "src/**"
      - "tests/**"
      - "configs/**"
      - "dvc.yaml"
      - "data/**/*.dvc"
      - "requirements*.txt"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: pytest -v

  train-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt

      - name: Identifiants DVC
        run: |
          dvc remote modify --local dagshub access_key_id ${{ secrets.DAGSHUB_TOKEN }}
          dvc remote modify --local dagshub secret_access_key ${{ secrets.DAGSHUB_TOKEN }}

      - name: Récupérer les données
        run: dvc pull -r dagshub data/raw/entrainement_ballon_dor_2014_2025.csv.dvc data/raw/candidats_ballon_dor_2026.csv.dvc

      - name: Entraîner
        run: dvc repro --force

      - name: Safe deployment (comparer au modèle en production)
        id: cmp
        run: python src/compare.py

      - name: Sauvegarder le modèle (DVC)
        if: steps.cmp.outputs.promote == 'true'
        run: dvc push -r dagshub

      - name: Build et push de l'image Docker
        if: steps.cmp.outputs.promote == 'true'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ghcr.io/$OWNER/mlops-ballon-dor:latest .
          docker push ghcr.io/$OWNER/mlops-ballon-dor:latest

      - name: Enregistrer le nouveau score de production
        if: steps.cmp.outputs.promote == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add metrics/production.json metrics/metrics.json dvc.lock
          git commit -m "chore: nouveau modèle en production [skip ci]" || true
          git push